<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СтройУправ — Офлайн</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1B5E20;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            color: #666;
            margin-bottom: 24px;
        }
        .retry-btn {
            display: inline-block;
            padding: 12px 32px;
            background: #1B5E20;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            min-width: 44px;
            min-height: 44px;
        }
        .retry-btn:active {
            background: #145216;
        }
        .hint {
            margin-top: 24px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" role="img" aria-label="Нет подключения">&#x1F4F6;</div>
        <h1>Нет подключения к сети</h1>
        <p>
            Проверьте интернет-соединение и попробуйте снова.
            Ваши офлайн-изменения сохранены и будут отправлены при подключении.
        </p>
        <button class="retry-btn" onclick="window.location.reload()">
            Попробовать снова
        </button>
        <p class="hint">
            Задачи и фото, сохранённые офлайн, синхронизируются автоматически.
        </p>
    </div>
</body>
</html>
